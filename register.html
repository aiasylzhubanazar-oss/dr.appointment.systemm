<main class="page-blue"><div class="form-wrap"><h1>Тіркелу</h1>
<form class="form" data-validate method="post" action="#" novalidate>
<div class="field"><label for="full_name">Аты-жөні</label><input type="text" id="full_name" name="full_name" autocomplete="name" required><div class="error" role="alert"></div></div><div class="field"><label for="phone">Телефон</label><input type="tel" id="phone" name="phone" placeholder="+7 700 000 00 00" required><div class="error" role="alert"></div></div>
<div class="field"><label for="email">Email</label><input type="email" id="email" name="email"  required><div class="error" role="alert"></div></div><div class="field"><label for="password">Құпия сөз (кемінде 8 таңба)</label><div class="pw"><input type="password" id="password" name="password" autocomplete="new-password" required><button type="button">Көрсету</button></div><div class="error" role="alert"></div></div><div class="field"><label for="password2">Құпия сөзді қайталаңыз</label><div class="pw"><input type="password" id="password2" name="password2"  required><button type="button">Көрсету</button></div><div class="error" role="alert"></div></div>
<button class="btn" type="submit">Тіркелу</button></form>
<p class="alt">Тіркелгіңіз бар ма? <a href="login.html">Кіру</a></p></div></main>
